<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Motion Fitness Platform - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./dashboard.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body class="db-page">
  <nav class="db-nav">
    <div class="db-logo">MOTION<span>AI</span></div>
    <ul class="db-nav-links">
      <li><a href="/">Introduction</a></li>
      <li><a href="/tracker">AI Tracker</a></li>
      <li class="active"><a href="/static/dashboard/dashboard.html">Dashboard</a></li>
    </ul>
  </nav>

  <main class="db-main">
    <header class="db-header">
      <div>
        <h2>Performance Analytics</h2>
        <p class="db-muted">누적된 오답 원인 분석 및 교정 트렌드 대시보드</p>
      </div>
      <label class="db-range">
        <span class="db-muted">기간</span>
        <select id="range-select">
          <option value="last:7">최근 7회</option>
          <option value="last:30">최근 30회</option>
          <option value="days:30">최근 30일</option>
        </select>
      </label>
    </header>

    <div class="db-tabs" id="exercise-tabs"></div>
    <div id="db-message" class="db-message" hidden></div>

    <!-- 0건 -->
    <div id="db-empty" class="db-empty" hidden>
      <i class="fa-solid fa-chart-pie"></i>
      <h3>아직 기록이 없어요</h3>
      <p>트래커에서 운동을 시작해 보세요.</p>
      <a class="db-btn" href="/tracker">AI Tracker로 이동</a>
    </div>

    <div id="db-content" hidden>
      <div class="db-summary" id="summary-cards"></div>

      <section class="db-card" id="trend-card">
        <h3>수행량·정확도 추이</h3>
        <p class="db-muted" id="trend-note" hidden>기록이 2개 이상이면 변화가 보여요</p>
        <div class="db-chart-box" id="trend-chart-box"><canvas id="trend-canvas"></canvas></div>
      </section>

      <div class="db-grid" id="error-row">
        <section class="db-card">
          <h3>오답 분포</h3>
          <div id="error-list" class="db-error-list"></div>
        </section>
        <section class="db-card">
          <h3>가장 많이 나온 오답</h3>
          <div id="top-error"></div>
        </section>
      </div>

      <section class="db-card db-table-card">
        <h3>최근 분석 수행 히스토리</h3>
        <table class="db-table">
          <thead>
            <tr><th>날짜 및 시간</th><th>수행 볼륨</th><th>자세 정확도</th><th>대표 오답</th><th></th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </section>
    </div>
  </main>
</body>
</html>
